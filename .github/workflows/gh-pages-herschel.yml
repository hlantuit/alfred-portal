name: GitHub Pages — Herschel Island

on:
  schedule:
    # Hourly, offset from the Shingle Point workflow
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: gh-pages-herschel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests Pillow xarray netcdf4 scipy

      - name: Generate data.json and copy images
        run: python scripts/generate_gh_pages.py --community herschel
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update gh-pages herschel [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
