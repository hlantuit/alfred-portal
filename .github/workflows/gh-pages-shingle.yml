name: GitHub Pages — Shingle Point

on:
  schedule:
    # Hourly, offset from the main fast workflow
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Generate data.json and copy images
        run: python scripts/generate_gh_pages.py --community shingle-point

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update gh-pages shingle-point [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
